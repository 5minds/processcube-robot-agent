[pytest]
# Pytest configuration for ProcessCube Robot Agent

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=processcube_robot_agent
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=60
    -ra

# Coverage options
[coverage:run]
source = processcube_robot_agent
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests
    slow: Tests that take significant time
    asyncio: Tests that use async/await