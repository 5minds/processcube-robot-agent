version: '3.8'

services:
  # ProcessCube Robot Agent
  robot-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: processcube-robot-agent
    ports:
      - "42042:42042"
    environment:
      CONFIG_FILE: /app/config.docker.json
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./robots:/app/robots
      - ./logs:/var/log/processcube-robot-agent
      - ./config.docker.json:/app/config.docker.json:ro
      - ./temp:/app/temp
    networks:
      - processcube-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42042/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - processcube-engine
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Mock ProcessCube Engine (for local development)
  processcube-engine:
    image: postgres:15-alpine
    container_name: processcube-engine-db
    environment:
      POSTGRES_DB: processcube
      POSTGRES_USER: processcube
      POSTGRES_PASSWORD: processcube-dev-password
    ports:
      - "5432:5432"
    volumes:
      - processcube-db-data:/var/lib/postgresql/data
    networks:
      - processcube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processcube"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  processcube-db-data:
    driver: local

networks:
  processcube-network:
    driver: bridge
