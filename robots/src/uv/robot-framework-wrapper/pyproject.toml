[project]
name = "robot-framework-wrapper"
version = "0.1.0"
description = "UV-based wrapper for executing Robot Framework files with ProcessCube Work Items integration"
requires-python = ">=3.11"
dependencies = [
    "robotframework>=7.0",
    "rpaframework>=31.0",
    "robocorp-workitems>=1.0.0",
    "webdriver-manager>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
]
